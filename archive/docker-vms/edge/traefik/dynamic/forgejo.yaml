http:
 #region routers 
  routers:
    forgejo:
      entryPoints:
        - "https"
      rule: "Host(`forgejo.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: forgejo

  services:
    forgejo:
      loadBalancer:
        servers:
          - url: "http://192.168.31.204:8082"            # Change IP Address to your proxmox instance
        passHostHeader: true

