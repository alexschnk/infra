http:
 #region routers 
  routers:
    dockhand:
      entryPoints:
        - "https"
      rule: "Host(`dockhand.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@docker
      tls: {}
      service: dockhand

  services:
    dockhand:
      loadBalancer:
        servers:
          - url: "http://192.168.31.204:8081"            # Change IP Address to your proxmox instance
        passHostHeader: true
