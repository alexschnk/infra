http:
 #region routers 
  routers:
    grafana:
      entryPoints:
        - "https"
      rule: "Host(`grafana.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
#        - authelia@docker
      tls: {}
      service: grafana

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://192.168.31.204:8086"            # Change IP Address to your proxmox instance
        passHostHeader: true
