services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /home/alex/data/qbittorrent/config:/config
      - /home/alex/shares/qbittorrent:/downloads #optional
    ports:
      - 8080:8080
#      - 6881:6881
#      - 6881:6881/udp
    restart: unless-stopped
    security_opt: 
      - no-new-privileges:true
