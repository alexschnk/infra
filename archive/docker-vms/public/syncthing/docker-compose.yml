services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: my-syncthing
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/alex/shares/syncthing/bases:/var/syncthing/bases
      - /home/alex/shares/syncthing/data:/var/syncthing/data
      - /home/alex/docker/syncthing/config:/var/syncthing/config
    ports:
      - 8081:8384 # Web UI
      - 21000:22000/tcp # TCP file transfers
#      - 21000:22000/udp # QUIC file transfers
#      - 2121:2132/tcp
#      - 10.0.0.2:22000:22000/udp
#      - 21027:21027/udp # Receive local discovery broadcasts
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
    security_opt: 
      - no-new-privileges:true
