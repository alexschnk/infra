services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
#      - "443:443/tcp"
#      - "443:443/udp"
#      - "3000:3000/tcp"
    volumes:
      - /home/alex/data/adguardhome/work:/opt/adguardhome/work
      - /home/alex/data/adguardhome/conf:/opt/adguardhome/conf
    security_opt: 
      - no-new-privileges:true
