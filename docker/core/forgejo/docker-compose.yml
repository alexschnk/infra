services:
  server:
    image: codeberg.org/forgejo/forgejo:13
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: unless-stopped
    security_opt: 
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/alex/data/forgejo/data:/data
    ports:
      - "8082:3000"
      - "222:22"
