http:
 #region routers 
  routers:
    pulse:
      entryPoints:
        - "https"
      rule: "Host(`pulse.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@docker
      tls: {}
      service: pulse

  services:
    pulse:
      loadBalancer:
        servers:
          - url: "http://192.168.31.204:8085"            # Change IP Address to your proxmox instance
        passHostHeader: true
