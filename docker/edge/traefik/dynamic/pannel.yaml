http:
 #region routers 
  routers:
    pannel:
      entryPoints:
        - "https"
      rule: "Host(`pannel.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
      tls: {}
      service: pannel

  services:
    pannel:
      loadBalancer:
        servers:
          - url: "http://192.168.31.207:8083"            # Change IP Address to your proxmox instance
        passHostHeader: true
