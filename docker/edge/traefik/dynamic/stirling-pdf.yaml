http:
 #region routers 
  routers:
    stirling-pdf:
      entryPoints:
        - "https"
      rule: "Host(`stirling-pdf.homelab.ru`)"        # Change DOMAIN_NAME to yours
      middlewares:
        - security-headers@file
        - authelia@docker
      tls: {}
      service: stirling-pdf

  services:
    stirling-pdf:
      loadBalancer:
        servers:
          - url: "http://192.168.31.202:8080"            # Change IP Address to your proxmox instance
        passHostHeader: true
